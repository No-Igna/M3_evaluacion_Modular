<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sistema de Inventario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container py-5">
      <h1 class="text-center mb-4">Sistema de Inventario - BroadSonick</h1>

      <div class="card shadow mb-4">
        <div class="card-body">
          <h4 id="tituloFormulario" class="card-title mb-3">
            Agregar Producto
          </h4>

          <div class="row g-3">
            <div class="col-md-4">
              <input
                type="text"
                id="nombre"
                class="form-control"
                placeholder="Nombre"
              />
            </div>

            <div class="col-md-3">
              <input
                type="text"
                id="categoria"
                class="form-control"
                placeholder="Categoría"
              />
            </div>

            <div class="col-md-2">
              <input
                type="number"
                id="precio"
                class="form-control"
                placeholder="Precio"
              />
            </div>

            <div class="col-md-2">
              <input
                type="number"
                id="stock"
                class="form-control"
                placeholder="Stock"
              />
            </div>

            <div class="col-md-1 d-grid">
              <button
                id="btnGuardar"
                class="btn btn-primary"
                onclick="agregarProducto()"
              >
                Agregar
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow">
        <div class="card-body">
          <h4 class="card-title">Inventario</h4>

          <div class="table-responsive">
            <table class="table table-striped">
              <thead class="table-dark">
                <tr>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Precio</th>
                  <th>Stock</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaInventario"></tbody>
            </table>
          </div>

          <h5 class="mt-3">Valor Total: $<span id="valorTotal">0</span></h5>
        </div>
      </div>
    </div>

    <script src="assets/js/script.js"></script>
  </body>
</html>
